<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Game Collection Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        psBlue: '#0070d1',
                        psNeon: '#00439c',
                        psGlow: '#00a4ff',
                        psDark: '#0a0d14',
                        psCard: '#121722',
                        psBorder: '#1f293d',
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(0, 112, 209, 0.4)',
                        'neon-lg': '0 0 25px rgba(0, 164, 255, 0.6)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0d14;
            color: #f3f4f6;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0d14;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0070d1;
        }
        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(18, 23, 34, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ps-gradient-text {
            background: linear-gradient(135deg, #00a4ff 0%, #0070d1 50%, #8a2be2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen bg-psDark text-gray-100 pb-12 flex flex-col">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 glass-panel border-b border-psBorder px-4 lg:px-8 py-3.5 mb-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Brand / Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-psBlue to-blue-400 flex items-center justify-center shadow-neon">
                    <i data-lucide="gamepad-2" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        PS5 <span class="ps-gradient-text">Tracker</span>
                    </h1>
                    <p class="text-xs text-gray-400">Personal Game Vault & Status Center</p>
                </div>
            </div>

            <!-- View Mode Tabs & Action Buttons -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full md:w-auto justify-between md:justify-end">
                <!-- View Switchers -->
                <div class="flex items-center bg-gray-900/80 p-1 rounded-xl border border-psBorder">
                    <button id="viewGridBtn" onclick="setViewMode('grid')" class="px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all bg-psBlue text-white shadow-sm">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i> Grid
                    </button>
                    <button id="viewTableBtn" onclick="setViewMode('table')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-white flex items-center gap-1.5 transition-all">
                        <i data-lucide="table" class="w-4 h-4"></i> Table
                    </button>
                    <button id="viewStatsBtn" onclick="setViewMode('stats')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-white flex items-center gap-1.5 transition-all">
                        <i data-lucide="pie-chart" class="w-4 h-4"></i> Stats
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-2">
                    <button onclick="openAddModal()" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-psBlue to-blue-600 hover:from-blue-600 hover:to-psBlue text-white shadow-neon flex items-center gap-1.5 transition-all transform active:scale-95">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Game
                    </button>

                    <!-- Export Dropdown -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleExportDropdown()" class="p-2 rounded-xl bg-gray-900 hover:bg-gray-800 border border-psBorder text-gray-300 hover:text-white transition-all">
                            <i data-lucide="download" class="w-4.5 h-4.5"></i>
                        </button>
                        <div id="exportMenu" class="hidden absolute right-0 mt-2 w-40 glass-panel rounded-xl shadow-2xl py-1 z-50 border border-psBorder">
                            <button onclick="exportCSV()" class="w-full text-left px-4 py-2 text-xs text-gray-300 hover:bg-psBlue/20 hover:text-white flex items-center gap-2">
                                <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 text-green-400"></i> Export CSV
                            </button>
                            <button onclick="exportJSON()" class="w-full text-left px-4 py-2 text-xs text-gray-300 hover:bg-psBlue/20 hover:text-white flex items-center gap-2">
                                <i data-lucide="file-json" class="w-3.5 h-3.5 text-blue-400"></i> Export JSON
                            </button>
                            <button onclick="resetData()" class="w-full text-left px-4 py-2 text-xs text-red-400 hover:bg-red-500/20 flex items-center gap-2 border-t border-gray-800">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Default
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 lg:px-8 flex-1 w-full space-y-6">

        <!-- KPI Analytics Overview Cards -->
        <section class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <!-- Total Games -->
            <div class="glass-panel p-4 rounded-2xl border border-psBorder flex flex-col justify-between hover:border-psBlue/40 transition-all">
                <div class="flex items-center justify-between text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Total Games</span>
                    <i data-lucide="library" class="w-4 h-4 text-psGlow"></i>
                </div>
                <div class="flex items-baseline justify-between">
                    <span id="kpiTotal" class="text-2xl sm:text-3xl font-bold text-white">0</span>
                    <span class="text-xs text-gray-400">Library</span>
                </div>
            </div>

            <!-- Bought Games -->
            <div class="glass-panel p-4 rounded-2xl border border-psBorder flex flex-col justify-between hover:border-emerald-500/40 transition-all">
                <div class="flex items-center justify-between text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Bought</span>
                    <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div class="flex items-baseline justify-between">
                    <span id="kpiBought" class="text-2xl sm:text-3xl font-bold text-emerald-400">0</span>
                    <span id="kpiBoughtPct" class="text-xs text-emerald-400/80 font-medium">0%</span>
                </div>
            </div>

            <!-- Not Bought (Wishlist/Backlog) -->
            <div class="glass-panel p-4 rounded-2xl border border-psBorder flex flex-col justify-between hover:border-amber-500/40 transition-all">
                <div class="flex items-center justify-between text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Not Bought</span>
                    <i data-lucide="bookmark" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div class="flex items-baseline justify-between">
                    <span id="kpiNotBought" class="text-2xl sm:text-3xl font-bold text-amber-400">0</span>
                    <span id="kpiNotBoughtPct" class="text-xs text-amber-400/80 font-medium">0%</span>
                </div>
            </div>

            <!-- Completed Games -->
            <div class="glass-panel p-4 rounded-2xl border border-psBorder flex flex-col justify-between hover:border-purple-500/40 transition-all">
                <div class="flex items-center justify-between text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Completed</span>
                    <i data-lucide="trophy" class="w-4 h-4 text-purple-400"></i>
                </div>
                <div class="flex items-baseline justify-between">
                    <span id="kpiCompleted" class="text-2xl sm:text-3xl font-bold text-purple-400">0</span>
                    <span id="kpiCompletedPct" class="text-xs text-purple-400/80 font-medium">0%</span>
                </div>
            </div>

            <!-- Completion Progress Bar -->
            <div class="glass-panel p-4 rounded-2xl border border-psBorder col-span-2 md:col-span-4 lg:col-span-1 flex flex-col justify-between">
                <div class="flex items-center justify-between text-gray-400 mb-1">
                    <span class="text-xs font-semibold uppercase tracking-wider">Completion Rate</span>
                    <i data-lucide="sparkles" class="w-4 h-4 text-psGlow"></i>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-300 font-semibold" id="progressText">0% Done</span>
                        <span class="text-gray-400" id="progressSub">0/0</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden p-0.5 border border-gray-700">
                        <div id="progressBar" class="bg-gradient-to-r from-psBlue via-purple-500 to-emerald-400 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Search, Filters, and Toolbar -->
        <section id="filterControls" class="glass-panel p-4 rounded-2xl border border-psBorder flex flex-col md:flex-row gap-4 items-center justify-between">
            <!-- Search Input -->
            <div class="relative w-full md:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="handleFilterChange()" placeholder="Search game title or notes..." 
                    class="w-full bg-gray-900/90 border border-psBorder text-white text-xs sm:text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-psBlue focus:ring-1 focus:ring-psBlue transition-all">
            </div>

            <!-- Filters Grid -->
            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                <!-- Genre Filter -->
                <select id="genreFilter" onchange="handleFilterChange()" class="bg-gray-900/90 border border-psBorder text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-psBlue">
                    <option value="ALL">All Genres</option>
                    <option value="Action / Adventure">Action / Adventure</option>
                    <option value="Action / Open World">Action / Open World</option>
                    <option value="RPG">RPG</option>
                    <option value="Horror">Horror</option>
                    <option value="Horror / Action">Horror / Action</option>
                </select>

                <!-- Status Filter -->
                <select id="statusFilter" onchange="handleFilterChange()" class="bg-gray-900/90 border border-psBorder text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-psBlue">
                    <option value="ALL">All Played Status</option>
                    <option value="Completed">Completed</option>
                    <option value="Playing">Playing</option>
                    <option value="Not Played">Not Played</option>
                </select>

                <!-- Ownership Filter -->
                <select id="ownershipFilter" onchange="handleFilterChange()" class="bg-gray-900/90 border border-psBorder text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-psBlue">
                    <option value="ALL">All Ownership</option>
                    <option value="Bought">Bought</option>
                    <option value="Not Bought">Not Bought</option>
                </select>

                <!-- Sort By -->
                <select id="sortBy" onchange="handleFilterChange()" class="bg-gray-900/90 border border-psBorder text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-psBlue">
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                    <option value="status">Played Status</option>
                    <option value="bought">Ownership</option>
                </select>
            </div>
        </section>

        <!-- VIEW 1: GRID VIEW -->
        <section id="gridView" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">
            <!-- Dynamic Grid Items will be rendered here -->
        </section>

        <!-- VIEW 2: EXCEL / TABLE VIEW -->
        <section id="tableView" class="hidden glass-panel rounded-2xl border border-psBorder overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm text-gray-300">
                    <thead class="bg-gray-900/90 text-gray-400 uppercase text-[11px] font-semibold tracking-wider border-b border-psBorder">
                        <tr>
                            <th scope="col" class="px-4 py-3.5">#</th>
                            <th scope="col" class="px-4 py-3.5">Game Title</th>
                            <th scope="col" class="px-4 py-3.5">Genre</th>
                            <th scope="col" class="px-4 py-3.5">Played Status</th>
                            <th scope="col" class="px-4 py-3.5">Ownership</th>
                            <th scope="col" class="px-4 py-3.5">Notes</th>
                            <th scope="col" class="px-4 py-3.5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-800/60">
                        <!-- Dynamic Table Rows -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- VIEW 3: STATS & ANALYTICS VIEW -->
        <section id="statsView" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Genre Chart -->
                <div class="glass-panel p-5 rounded-2xl border border-psBorder flex flex-col items-center">
                    <h3 class="text-sm font-semibold text-gray-200 mb-4 flex items-center gap-2">
                        <i data-lucide="pie-chart" class="w-4 h-4 text-psGlow"></i> Genre Breakdown
                    </h3>
                    <div class="w-full h-64 relative flex items-center justify-center">
                        <canvas id="genreChart"></canvas>
                    </div>
                </div>

                <!-- Played Status Chart -->
                <div class="glass-panel p-5 rounded-2xl border border-psBorder flex flex-col items-center">
                    <h3 class="text-sm font-semibold text-gray-200 mb-4 flex items-center gap-2">
                        <i data-lucide="gamepad" class="w-4 h-4 text-purple-400"></i> Played Status
                    </h3>
                    <div class="w-full h-64 relative flex items-center justify-center">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>

                <!-- Ownership Chart -->
                <div class="glass-panel p-5 rounded-2xl border border-psBorder flex flex-col items-center">
                    <h3 class="text-sm font-semibold text-gray-200 mb-4 flex items-center gap-2">
                        <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-400"></i> Ownership Ratio
                    </h3>
                    <div class="w-full h-64 relative flex items-center justify-center">
                        <canvas id="ownershipChart"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ADD / EDIT GAME MODAL -->
    <div id="gameModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl border border-psBorder p-6 shadow-2xl relative space-y-4">
            <div class="flex items-center justify-between border-b border-psBorder pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-psBlue"></i> Add New Game
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="gameForm" onsubmit="saveGameForm(event)" class="space-y-4 text-xs sm:text-sm">
                <input type="hidden" id="modalGameId">
                
                <!-- Game Title -->
                <div>
                    <label class="block text-gray-300 font-medium mb-1">Game Title *</label>
                    <input type="text" id="modalTitleInput" required placeholder="e.g. Demon's Souls" 
                        class="w-full bg-gray-900 border border-psBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-psBlue">
                </div>

                <!-- Genre & Ownership Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Genre</label>
                        <select id="modalGenreInput" class="w-full bg-gray-900 border border-psBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-psBlue">
                            <option value="Action / Adventure">Action / Adventure</option>
                            <option value="Action / Open World">Action / Open World</option>
                            <option value="RPG">RPG</option>
                            <option value="Horror">Horror</option>
                            <option value="Horror / Action">Horror / Action</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Ownership</label>
                        <select id="modalOwnershipInput" class="w-full bg-gray-900 border border-psBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-psBlue">
                            <option value="Not Bought">Not Bought</option>
                            <option value="Bought">Bought</option>
                        </select>
                    </div>
                </div>

                <!-- Played Status -->
                <div>
                    <label class="block text-gray-300 font-medium mb-1">Played Status</label>
                    <select id="modalStatusInput" class="w-full bg-gray-900 border border-psBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-psBlue">
                        <option value="Not Played">Not Played</option>
                        <option value="Playing">Playing</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-gray-300 font-medium mb-1">Notes / Platform Details</label>
                    <textarea id="modalNotesInput" rows="3" placeholder="e.g. On PC, Remastered Edition, Pre-order..." 
                        class="w-full bg-gray-900 border border-psBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-psBlue resize-none"></textarea>
                </div>

                <!-- Modal Actions -->
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-psBorder">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-gray-800 text-gray-300 hover:bg-gray-700 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-psBlue hover:bg-blue-600 text-white font-semibold shadow-neon transition-all">
                        Save Game
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out glass-panel px-4 py-3 rounded-xl border border-psBlue/50 text-white shadow-neon flex items-center gap-3">
        <i id="toastIcon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toastMsg" class="text-xs sm:text-sm font-medium">Notification message</span>
    </div>

    <script>
        // Default Pre-loaded 30 PS5 Games Dataset based on user's excel file
        const DEFAULT_GAMES = [
            { id: 1, title: "007: First Light", genre: "Action / Open World", status: "Not Played", bought: "Not Bought", notes: "" },

            { id: 14, title: "GTA VI", genre: "Action / Open World", status: "Not Played", bought: "Not Bought", notes: "Pre-order On PS5" },
            { id: 15, title: "Horizon Forbidden West", genre: "Action / Adventure", status: "Not Played", bought: "Not Bought", notes: "" },
            { id: 16, title: "Mafia: The Old Country", genre: "Action / Open World", status: "Not Played", bought: "Not Bought", notes: "" },

            { id: 25, title: "Resident Evil Village", genre: "Horror / Action", status: "Completed", bought: "Not Bought", notes: "On PC" },
            { id: 26, title: "The Last of Us Part I", genre: "Action / Adventure", status: "Completed", bought: "Not Bought", notes: "On PC" },

            { id: 28, title: "The Witcher 3: Wild Hunt", genre: "RPG", status: "Not Played", bought: "Not Bought", notes: "" },
            { id: 29, title: "Uncharted 4: A Thief's End", genre: "Action / Adventure", status: "Not Played", bought: "Bought", notes: "PS5 Remastered Collection" },
            { id: 30, title: "Uncharted: The Lost Legacy", genre: "Action / Adventure", status: "Not Played", bought: "Bought", notes: "PS5 Remastered Collection" }
        ];

        // State variables
        let games = [];
        let currentView = 'grid';
        let genreChartObj = null;
        let statusChartObj = null;
        let ownershipChartObj = null;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadGamesData();
            renderDashboard();
            lucide.createIcons();
        });

        // Load Games from LocalStorage or Default
        function loadGamesData() {
            const stored = localStorage.getItem('ps5_game_tracker_db');
            if (stored) {
                try {
                    games = JSON.parse(stored);
                } catch(e) {
                    games = [...DEFAULT_GAMES];
                }
            } else {
                games = [...DEFAULT_GAMES];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('ps5_game_tracker_db', JSON.stringify(games));
        }

        // Main Render Function
        function renderDashboard() {
            updateKPIs();
            const filteredGames = getFilteredAndSortedGames();
            
            if (currentView === 'grid') {
                renderGridView(filteredGames);
            } else if (currentView === 'table') {
                renderTableView(filteredGames);
            } else if (currentView === 'stats') {
                renderStatsView();
            }
            lucide.createIcons();
        }

        // Update KPI Top Cards
        function updateKPIs() {
            const total = games.length;
            const bought = games.filter(g => g.bought === 'Bought').length;
            const notBought = total - bought;
            const completed = games.filter(g => g.status === 'Completed').length;
            
            const boughtPct = total > 0 ? Math.round((bought / total) * 100) : 0;
            const notBoughtPct = total > 0 ? Math.round((notBought / total) * 100) : 0;
            const completedPct = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('kpiTotal').innerText = total;
            document.getElementById('kpiBought').innerText = bought;
            document.getElementById('kpiBoughtPct').innerText = `${boughtPct}%`;
            document.getElementById('kpiNotBought').innerText = notBought;
            document.getElementById('kpiNotBoughtPct').innerText = `${notBoughtPct}%`;
            document.getElementById('kpiCompleted').innerText = completed;
            document.getElementById('kpiCompletedPct').innerText = `${completedPct}%`;

            document.getElementById('progressText').innerText = `${completedPct}% Completed`;
            document.getElementById('progressSub').innerText = `${completed} of ${total} games`;
            document.getElementById('progressBar').style.width = `${completedPct}%`;
        }

        // Filter and Sort Logic
        function getFilteredAndSortedGames() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const genre = document.getElementById('genreFilter').value;
            const status = document.getElementById('statusFilter').value;
            const ownership = document.getElementById('ownershipFilter').value;
            const sort = document.getElementById('sortBy').value;

            return games.filter(g => {
                const matchesSearch = g.title.toLowerCase().includes(search) || (g.notes && g.notes.toLowerCase().includes(search));
                const matchesGenre = genre === 'ALL' || g.genre === genre;
                const matchesStatus = status === 'ALL' || g.status === status;
                const matchesOwnership = ownership === 'ALL' || g.bought === ownership;
                return matchesSearch && matchesGenre && matchesStatus && matchesOwnership;
            }).sort((a, b) => {
                if (sort === 'title-asc') return a.title.localeCompare(b.title);
                if (sort === 'title-desc') return b.title.localeCompare(a.title);
                if (sort === 'status') return a.status.localeCompare(b.status);
                if (sort === 'bought') return a.bought.localeCompare(b.bought);
                return 0;
            });
        }

        function handleFilterChange() {
            renderDashboard();
        }

        // View Mode Switcher
        function setViewMode(mode) {
            currentView = mode;
            const gridBtn = document.getElementById('viewGridBtn');
            const tableBtn = document.getElementById('viewTableBtn');
            const statsBtn = document.getElementById('viewStatsBtn');

            const gridView = document.getElementById('gridView');
            const tableView = document.getElementById('tableView');
            const statsView = document.getElementById('statsView');

            // Reset tab styles
            [gridBtn, tableBtn, statsBtn].forEach(btn => {
                btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-white flex items-center gap-1.5 transition-all";
            });

            // Hide all views
            gridView.classList.add('hidden');
            tableView.classList.add('hidden');
            statsView.classList.add('hidden');

            if (mode === 'grid') {
                gridBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all bg-psBlue text-white shadow-sm";
                gridView.classList.remove('hidden');
            } else if (mode === 'table') {
                tableBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all bg-psBlue text-white shadow-sm";
                tableView.classList.remove('hidden');
            } else if (mode === 'stats') {
                statsBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all bg-psBlue text-white shadow-sm";
                statsView.classList.remove('hidden');
            }
            renderDashboard();
        }

        // Render Grid View
        function renderGridView(data) {
            const container = document.getElementById('gridView');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-gray-400 glass-panel rounded-2xl border border-psBorder">
                        <i data-lucide="ghost" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p class="text-base font-semibold">No matching games found</p>
                        <p class="text-xs text-gray-500 mt-1">Try tweaking your search term or filter options.</p>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(game => {
                const isBought = game.bought === 'Bought';
                const statusColor = game.status === 'Completed' ? 'bg-purple-500/20 text-purple-300 border-purple-500/40' : 
                                    (game.status === 'Playing' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-gray-800/80 text-gray-400 border-gray-700');
                
                const boughtBadge = isBought ? 
                    `<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Bought</span>` :
                    `<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-gray-800 text-gray-400 border border-gray-700 flex items-center gap-1"><i data-lucide="shopping-cart" class="w-3 h-3"></i> Wishlist</span>`;

                // SVG Graphic Header based on Title Hash
                const bgGradient = getGradientForGame(game.title);

                return `
                <div class="glass-panel rounded-2xl border border-psBorder overflow-hidden hover:border-psBlue/50 transition-all duration-300 hover:shadow-neon group flex flex-col justify-between">
                    <div>
                        <!-- Game Cover Canvas Graphic Header -->
                        <div class="h-28 w-full ${bgGradient} p-4 flex flex-col justify-between relative overflow-hidden">
                            <div class="absolute inset-0 bg-black/20 backdrop-blur-[1px]"></div>
                            <div class="relative z-10 flex items-center justify-between">
                                <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider bg-black/40 text-gray-200 border border-white/10 backdrop-blur-md">
                                    ${game.genre}
                                </span>
                                <div class="flex items-center gap-1 bg-black/40 backdrop-blur-md rounded-lg p-1 border border-white/10">
                                    <button onclick="editGame(${game.id})" title="Edit Game" class="p-1 hover:text-psGlow text-gray-300 transition-colors">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="deleteGame(${game.id})" title="Delete Game" class="p-1 hover:text-red-400 text-gray-300 transition-colors">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="relative z-10">
                                <h3 class="font-bold text-white text-base leading-tight drop-shadow-md group-hover:text-psGlow transition-colors line-clamp-1">
                                    ${game.title}
                                </h3>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="p-4 space-y-3">
                            <!-- Badges Row -->
                            <div class="flex items-center justify-between text-xs">
                                <!-- Fast Click Ownership Toggle -->
                                <button onclick="toggleBought(${game.id})" class="cursor-pointer hover:opacity-80 transition-opacity">
                                    ${boughtBadge}
                                </button>
                                
                                <!-- Fast Click Status Toggle -->
                                <button onclick="toggleStatus(${game.id})" class="px-2.5 py-1 rounded-md text-[11px] font-medium border ${statusColor} flex items-center gap-1.5 transition-all hover:scale-105">
                                    <span class="w-1.5 h-1.5 rounded-full ${game.status === 'Completed' ? 'bg-purple-400' : (game.status === 'Playing' ? 'bg-amber-400' : 'bg-gray-500')}"></span>
                                    ${game.status}
                                </button>
                            </div>

                            <!-- Editable Inline Notes -->
                            <div class="pt-1">
                                <label class="text-[10px] text-gray-500 uppercase font-semibold block mb-1">Notes / Platform</label>
                                <input type="text" value="${game.notes || ''}" placeholder="Add note..." 
                                    onchange="updateInlineNotes(${game.id}, this.value)"
                                    class="w-full bg-gray-900/60 border border-gray-800 text-xs rounded-lg px-2.5 py-1.5 text-gray-300 focus:outline-none focus:border-psBlue focus:bg-gray-900 transition-all">
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Generate dynamic aesthetic gradients for game covers
        function getGradientForGame(title) {
            const gradients = [
                'bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900',
                'bg-gradient-to-br from-purple-900 via-slate-900 to-psDark',
                'bg-gradient-to-br from-cyan-900 via-blue-900 to-slate-900',
                'bg-gradient-to-br from-emerald-900 via-slate-900 to-blue-950',
                'bg-gradient-to-br from-violet-900 via-purple-950 to-slate-900',
                'bg-gradient-to-br from-rose-950 via-slate-900 to-purple-950'
            ];
            let hash = 0;
            for (let i = 0; i < title.length; i++) hash += title.charCodeAt(i);
            return gradients[hash % gradients.length];
        }

        // Render Excel-like Table View
        function renderTableView(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colSpan="7" class="text-center py-8 text-gray-500">No games matched your filters.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((game, index) => {
                return `
                <tr class="hover:bg-psBlue/10 transition-colors group">
                    <td class="px-4 py-3 text-gray-500 font-mono text-xs">${index + 1}</td>
                    <td class="px-4 py-3 font-semibold text-white">${game.title}</td>
                    <td class="px-4 py-3 text-gray-400">
                        <span class="px-2 py-0.5 rounded bg-gray-800 border border-gray-700 text-[11px]">${game.genre}</span>
                    </td>
                    <td class="px-4 py-3">
                        <button onclick="toggleStatus(${game.id})" class="px-2.5 py-1 rounded-md text-xs font-medium ${game.status === 'Completed' ? 'bg-purple-500/20 text-purple-300' : (game.status === 'Playing' ? 'bg-amber-500/20 text-amber-300' : 'bg-gray-800 text-gray-400')}">
                            ${game.status}
                        </button>
                    </td>
                    <td class="px-4 py-3">
                        <button onclick="toggleBought(${game.id})" class="px-2.5 py-1 rounded-md text-xs font-medium ${game.bought === 'Bought' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-gray-800 text-gray-400'}">
                            ${game.bought}
                        </button>
                    </td>
                    <td class="px-4 py-3">
                        <input type="text" value="${game.notes || ''}" placeholder="Click to add note..." 
                            onchange="updateInlineNotes(${game.id}, this.value)"
                            class="bg-transparent hover:bg-gray-900/80 focus:bg-gray-900 border border-transparent hover:border-gray-700 focus:border-psBlue text-xs rounded px-2 py-1 text-gray-300 w-full outline-none transition-all">
                    </td>
                    <td class="px-4 py-3 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="editGame(${game.id})" class="p-1 hover:text-psGlow text-gray-400 transition-colors">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteGame(${game.id})" class="p-1 hover:text-red-400 text-gray-400 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        // Render Chart.js Analytics View
        function renderStatsView() {
            // Genre Distribution Data
            const genreCounts = {};
            games.forEach(g => genreCounts[g.genre] = (genreCounts[g.genre] || 0) + 1);

            // Played Status Data
            const statusCounts = { 'Completed': 0, 'Playing': 0, 'Not Played': 0 };
            games.forEach(g => statusCounts[g.status] = (statusCounts[g.status] || 0) + 1);

            // Ownership Data
            const ownershipCounts = { 'Bought': 0, 'Not Bought': 0 };
            games.forEach(g => ownershipCounts[g.bought] = (ownershipCounts[g.bought] || 0) + 1);

            // Chart Configuration Helpers
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#9ca3af', font: { family: 'Inter', size: 11 } } }
                }
            };

            // 1. Genre Chart (Doughnut)
            if (genreChartObj) genreChartObj.destroy();
            const genreCtx = document.getElementById('genreChart').getContext('2d');
            genreChartObj = new Chart(genreCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(genreCounts),
                    datasets: [{
                        data: Object.values(genreCounts),
                        backgroundColor: ['#0070d1', '#8a2be2', '#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: chartOptions
            });

            // 2. Status Chart (Pie)
            if (statusChartObj) statusChartObj.destroy();
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            statusChartObj = new Chart(statusCtx, {
                type: 'pie',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#a855f7', '#f59e0b', '#4b5563'],
                        borderWidth: 0
                    }]
                },
                options: chartOptions
            });

            // 3. Ownership Chart (Doughnut)
            if (ownershipChartObj) ownershipChartObj.destroy();
            const ownershipCtx = document.getElementById('ownershipChart').getContext('2d');
            ownershipChartObj = new Chart(ownershipCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(ownershipCounts),
                    datasets: [{
                        data: Object.values(ownershipCounts),
                        backgroundColor: ['#10b981', '#6b7280'],
                        borderWidth: 0
                    }]
                },
                options: chartOptions
            });
        }

        // Fast Toggle Status: Not Played -> Playing -> Completed -> Not Played
        function toggleStatus(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            
            if (game.status === 'Not Played') game.status = 'Playing';
            else if (game.status === 'Playing') game.status = 'Completed';
            else game.status = 'Not Played';

            saveToLocalStorage();
            renderDashboard();
            showToast(`Status updated to "${game.status}" for ${game.title}`);
        }

        // Fast Toggle Ownership: Bought <-> Not Bought
        function toggleBought(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;

            game.bought = game.bought === 'Bought' ? 'Not Bought' : 'Bought';
            saveToLocalStorage();
            renderDashboard();
            showToast(`Ownership set to "${game.bought}" for ${game.title}`);
        }

        // Inline Notes Update
        function updateInlineNotes(id, noteText) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            game.notes = noteText;
            saveToLocalStorage();
            showToast(`Note saved for ${game.title}`);
        }

        // Modal Logic
        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5 text-psBlue"></i> Add New Game`;
            document.getElementById('modalGameId').value = '';
            document.getElementById('modalTitleInput').value = '';
            document.getElementById('modalGenreInput').value = 'Action / Adventure';
            document.getElementById('modalStatusInput').value = 'Not Played';
            document.getElementById('modalOwnershipInput').value = 'Not Bought';
            document.getElementById('modalNotesInput').value = '';
            
            document.getElementById('gameModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function editGame(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;

            document.getElementById('modalTitle').innerHTML = `<i data-lucide="edit-2" class="w-5 h-5 text-psBlue"></i> Edit Game`;
            document.getElementById('modalGameId').value = game.id;
            document.getElementById('modalTitleInput').value = game.title;
            document.getElementById('modalGenreInput').value = game.genre;
            document.getElementById('modalStatusInput').value = game.status;
            document.getElementById('modalOwnershipInput').value = game.bought;
            document.getElementById('modalNotesInput').value = game.notes || '';

            document.getElementById('gameModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('gameModal').classList.add('hidden');
        }

        function saveGameForm(event) {
            event.preventDefault();
            const id = document.getElementById('modalGameId').value;
            const title = document.getElementById('modalTitleInput').value.trim();
            const genre = document.getElementById('modalGenreInput').value;
            const status = document.getElementById('modalStatusInput').value;
            const bought = document.getElementById('modalOwnershipInput').value;
            const notes = document.getElementById('modalNotesInput').value.trim();

            if (!title) return;

            if (id) {
                // Edit existing
                const index = games.findIndex(g => g.id == id);
                if (index !== -1) {
                    games[index] = { ...games[index], title, genre, status, bought, notes };
                    showToast(`Updated "${title}" successfully!`);
                }
            } else {
                // Add new
                const newId = games.length > 0 ? Math.max(...games.map(g => g.id)) + 1 : 1;
                games.unshift({ id: newId, title, genre, status, bought, notes });
                showToast(`Added "${title}" to library!`);
            }

            saveToLocalStorage();
            closeModal();
            renderDashboard();
        }

        function deleteGame(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            
            if (confirm(`Are you sure you want to remove "${game.title}" from your library?`)) {
                games = games.filter(g => g.id !== id);
                saveToLocalStorage();
                renderDashboard();
                showToast(`Removed "${game.title}"`);
            }
        }

        // Export Functions
        function toggleExportDropdown() {
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('hidden');
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,ID,Game Title,Genre,Played Status,Ownership,Notes\n";
            games.forEach(g => {
                const row = [g.id, `"${g.title}"`, `"${g.genre}"`, `"${g.status}"`, `"${g.bought}"`, `"${g.notes || ''}"`].join(",");
                csvContent += row + "\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "PS5_Game_Collection.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            toggleExportDropdown();
            showToast("Exported collection to CSV!");
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(games, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "PS5_Game_Collection.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            toggleExportDropdown();
            showToast("Exported collection to JSON!");
        }

        function resetData() {
            if (confirm("Reset collection back to the original 30 PS5 games list?")) {
                games = [...DEFAULT_GAMES];
                saveToLocalStorage();
                renderDashboard();
                toggleExportDropdown();
                showToast("Data reset to default 30 PS5 games.");
            }
        }

        // Toast Notification Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('exportMenu');
            const button = e.target.closest('button');
            if (!button || !button.getAttribute('onclick')?.includes('toggleExportDropdown')) {
                if (menu && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
